name: Update AI Daily and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test cloud updater
        run: python -m unittest discover -s scripts/tests -p 'test_cloud_daily.py'
      - name: Collect public AI sources
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'Enable cloud updater')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cloud_daily.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Save validated daily content
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'Enable cloud updater')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ai-daily/content.json ai-daily/archive ai-daily/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AI source digest [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
